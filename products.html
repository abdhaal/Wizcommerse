<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>All Products - Wiz Commerce</title>

    <link
        rel="stylesheet"
        href="css/products.css"
    >

</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="container header-inner">

        <a
            href="index.html"
            class="logo"
        >
            WIZ<span>COMMERCE</span>
        </a>


        <div class="search-box">

            <input
                type="search"
                id="productSearch"
                placeholder="Search products..."
            >

            <button
                type="button"
                onclick="document.getElementById('productSearch').focus()"
            >
                🔍
            </button>

        </div>


        <div class="header-actions">

            <a
                href="index.html"
                class="header-link"
            >
                Home
            </a>


            <a
                href="cart.html"
                class="cart-link"
            >
                🛒 Cart

                <span class="cart-count">
                    0
                </span>

            </a>

        </div>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

    <section class="products-section">

        <div class="container">


            <!-- PAGE TITLE -->

            <div class="page-heading">

                <div>

                    <p class="eyebrow">
                        WIZ COMMERCE
                    </p>

                    <h1>
                        All Products
                    </h1>

                    <p>
                        Discover trusted products at the best prices.
                    </p>

                </div>


                <!-- CATEGORY -->

                <div class="filter-box">

                    <label for="categoryFilter">
                        Category
                    </label>

                    <select
                        id="categoryFilter"
                    >

                        <option value="All">
                            All Products
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Fashion">
                            Fashion
                        </option>

                        <option value="Home & Kitchen">
                            Home & Kitchen
                        </option>

                    </select>

                </div>

            </div>


            <!-- PRODUCT GRID -->

            <div
                id="productsGrid"
                class="products-grid"
            >

                <!-- Products generated by products.js -->

            </div>

        </div>

    </section>

</main>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="productsToast"
    class="products-toast"
></div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/products.js"></script>

</body>

</html>
